name: Save CV as PDF

# Runs after GitHub Pages' built-in "pages-build-deployment" finishes.
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: save-cv-pdf
  cancel-in-progress: true

jobs:
  pdf:
    # Only after a successful deploy, and not for deploys caused by this
    # workflow's own PDF commit (prevents an endless loop).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_commit.author.name != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the live site to update
        run: sleep 30

      - name: Print live site to PDF
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/?v=${GITHUB_RUN_ID}"
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --no-pdf-header-footer --virtual-time-budget=10000 \
            --print-to-pdf=cv.pdf "$URL"
          ls -l cv.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update cv.pdf from live site"
          git push
